name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CryptoIndicatorApp.sln

      - name: Build
        run: dotnet build CryptoIndicatorApp.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test CryptoIndicatorApp.sln --configuration Release --no-restore --no-build --logger "trx;LogFilePrefix=solution"

      - name: Test Memory CLI
        run: dotnet test tools/Memory.Tests/CryptoIndicatorApp.Memory.Tests.csproj --configuration Release --no-restore --no-build --logger "trx;LogFilePrefix=memory-cli"

      - name: Retain PilotB test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pilotb-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/PilotB.Tests/TestResults/*.trx
          retention-days: 7
          if-no-files-found: warn
