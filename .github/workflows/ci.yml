name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CryptoIndicatorApp.sln

      - name: Verify formatting
        run: dotnet format CryptoIndicatorApp.sln --verify-no-changes

      - name: Build
        run: dotnet build CryptoIndicatorApp.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test CryptoIndicatorApp.sln --configuration Release --no-restore --no-build --logger "trx;LogFilePrefix=solution"
