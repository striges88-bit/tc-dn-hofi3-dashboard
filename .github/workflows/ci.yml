name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CryptoIndicatorApp.sln

      - name: Build
        run: dotnet build CryptoIndicatorApp.sln --configuration Release --no-restore

      - name: Test solution
        run: dotnet test CryptoIndicatorApp.sln --configuration Release --no-restore --no-build --logger "trx;LogFilePrefix=solution"

      - name: Test Memory CLI
        run: dotnet test tools/Memory.Tests/CryptoIndicatorApp.Memory.Tests.csproj --configuration Release --no-restore --no-build --logger "trx;LogFilePrefix=memory-cli"

  memory-lightweight:
    name: Lightweight canonical memory
    needs: dotnet
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore Memory CLI
        run: dotnet restore tools/Memory/CryptoIndicatorApp.Memory.csproj --disable-parallel

      - name: Build Memory CLI
        run: dotnet build tools/Memory/CryptoIndicatorApp.Memory.csproj --configuration Release --no-restore

      - name: Memory status before SQLite refresh
        run: dotnet run --project tools/Memory/CryptoIndicatorApp.Memory.csproj --configuration Release --no-build --no-restore -- status --project-root . --json

      - name: Refresh canonical SQLite from HEAD
        run: dotnet run --project tools/Memory/CryptoIndicatorApp.Memory.csproj --configuration Release --no-build --no-restore -- refresh-from-commit --commit HEAD --project-root . --json

      - name: SQLite stale-check
        run: dotnet run --project tools/Memory/CryptoIndicatorApp.Memory.csproj --configuration Release --no-build --no-restore -- stale-check --project-root . --json

      - name: Assert SQLite memory is current
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          . scripts\memory-pre-push-contract.ps1
          $statusJson = (dotnet run --project tools/Memory/CryptoIndicatorApp.Memory.csproj --configuration Release --no-build --no-restore -- status --project-root . --json | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "Memory status failed with exit code $LASTEXITCODE."
          }
          $status = $statusJson | ConvertFrom-Json
          Write-Output $statusJson

          $head = Get-JsonStringProperty -Object $status -Name 'head'
          $indexedCommit = Get-JsonStringProperty -Object $status -Name 'indexed_commit'
          $indexedTree = Get-JsonStringProperty -Object $status -Name 'indexed_tree'
          $indexedAt = Get-JsonStringProperty -Object $status -Name 'indexed_at'
          if ($null -eq $head -or $null -eq $indexedCommit -or $null -eq $indexedTree -or $null -eq $indexedAt) {
            throw 'Memory status requires non-empty string head/indexed_commit/indexed_tree/indexed_at.'
          }
          foreach ($field in @('marker_exists', 'needs_refresh', 'working_tree_dirty')) {
            $property = $status.PSObject.Properties[$field]
            if ($null -eq $property -or $property.Value -isnot [bool]) {
              throw "Memory status $field must be a JSON boolean."
            }
          }
          if (-not (Test-JsonPropertyFalse -Object $status -Name 'needs_refresh')) {
            throw 'SQLite memory still needs refresh after commit-addressed refresh.'
          }

          $expectedHead = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not resolve Git HEAD for the memory status contract.'
          }
          $expectedTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not resolve the Git tree for the memory status contract.'
          }
          if ($head -cne $expectedHead -or $indexedCommit -cne $expectedHead) {
            throw "SQLite head/indexed_commit does not match Git HEAD $expectedHead."
          }
          if ($indexedTree -cne $expectedTree) {
            throw "SQLite indexed_tree $indexedTree does not match Git tree $expectedTree."
          }

  memory-semantic:
    name: Cached semantic memory quality
    needs: memory-lightweight
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore and build Memory CLI
        run: |
          dotnet restore tools/Memory/CryptoIndicatorApp.Memory.csproj --disable-parallel
          dotnet build tools/Memory/CryptoIndicatorApp.Memory.csproj --configuration Release --no-restore

      - name: Build canonical SQLite input
        run: dotnet run --project tools/Memory/CryptoIndicatorApp.Memory.csproj --configuration Release --no-build --no-restore -- refresh-from-commit --commit HEAD --project-root . --json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup cached uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: |
            scripts/lancedb-sidecar.ps1
            scripts/memory-semantic-doctor.ps1
            tools/MemorySemantic/*.py

      - name: Configure FastEmbed model cache
        shell: powershell
        run: |
          $modelCache = Join-Path $env:RUNNER_TEMP 'fastembed_cache'
          "FASTEMBED_CACHE_PATH=$modelCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore FastEmbed model cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\fastembed_cache
          key: fastembed-${{ runner.os }}-py312-fastembed-0.8.0-paraphrase-multilingual-minilm-l12-v2-mean

      - name: Explicit semantic dependency preflight
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\memory-semantic-doctor.ps1 -AllowNetworkPreflight -TimeoutSeconds 300

      - name: Explicit FastEmbed model cache preflight
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\lancedb-sidecar.ps1 -Command preflight -AllowNetworkPreflight

      - name: Prove semantic dependencies work offline
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\memory-semantic-doctor.ps1 -TimeoutSeconds 300

      - name: Test semantic sidecar
        run: uv run --offline --python 3.12 --with lancedb==0.34.0 --with pyarrow==24.0.0 --with fastembed==0.8.0 python tools/MemorySemantic/lancedb_sidecar_tests.py

      - name: Rebuild LanceDB from SQLite
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\lancedb-sidecar.ps1 -Command cleanup
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\lancedb-sidecar.ps1 -Command rebuild

      - name: LanceDB semantic eval
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\lancedb-sidecar.ps1 -Command eval

      - name: Assert semantic commit and manifest contract
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          . scripts\memory-pre-push-contract.ps1

          $evalReport = Read-JsonFile -Path 'docs\memory\generated\lancedb-sidecar-report.json'
          $evalValidation = Test-LanceDbEvalReport -Report $evalReport -MinimumEvalCases 11
          if (-not $evalValidation.passed) {
            throw "LanceDB eval report contract failed: $($evalValidation.detail)"
          }

          $head = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not resolve Git HEAD for the semantic contract.'
          }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not resolve the Git tree for the semantic contract.'
          }
          $currentIdentity = [pscustomobject]@{ commit_sha = $head; tree_sha = $tree }

          $freshness = Test-CommitAddressedFreshness -Root (Get-Location).Path -RefreshReport $currentIdentity -EvalReport $evalReport
          if (-not $freshness.passed) {
            throw "Semantic commit freshness failed: $($freshness.detail)"
          }

          $manifest = Test-SemanticIndexManifest `
            -DatabasePath 'docs\memory\generated\project-memory.sqlite' `
            -StorePath 'docs\memory\generated\lancedb' `
            -ManifestPath 'docs\memory\generated\lancedb-manifest.json' `
            -RefreshReport $currentIdentity `
            -EvalReport $evalReport
          if (-not $manifest.passed) {
            throw "Semantic index manifest contract failed: $($manifest.detail)"
          }
