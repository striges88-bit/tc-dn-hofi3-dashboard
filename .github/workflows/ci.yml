name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          dotnet restore CryptoIndicatorApp.sln --verbosity minimal --tl:off 2>&1 | Tee-Object TestResults/restore.log
          $taskExit = $LASTEXITCODE
          $taskExit | Set-Content TestResults/restore.exit-code
          exit $taskExit

      - name: Verify formatting
        run: |
          dotnet format CryptoIndicatorApp.sln --verify-no-changes --no-restore --verbosity minimal 2>&1 | Tee-Object TestResults/format.log
          $taskExit = $LASTEXITCODE
          $taskExit | Set-Content TestResults/format.exit-code
          exit $taskExit

      - name: Build
        run: |
          dotnet build CryptoIndicatorApp.sln --configuration Release --no-restore --verbosity minimal --tl:off 2>&1 | Tee-Object TestResults/build.log
          $taskExit = $LASTEXITCODE
          $taskExit | Set-Content TestResults/build.exit-code
          exit $taskExit

      - name: Test solution
        run: |
          dotnet test CryptoIndicatorApp.sln --configuration Release --no-build --no-restore --verbosity minimal --tl:off --logger "trx;LogFilePrefix=solution" 2>&1 | Tee-Object TestResults/test.log
          $taskExit = $LASTEXITCODE
          $taskExit | Set-Content TestResults/test.exit-code
          exit $taskExit

      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: |
            TestResults/
            **/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
